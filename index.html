<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafaf9" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="./favicon-32.png" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>I Want This</title>
    <!-- Umami : mesure d'audience sans cookie. Les adresses sont nettoyées avant envoi :
         route du HashRouter remise en chemin, identifiants et jetons de partage masqués, paramètres retirés. -->
    <script>
      function umamiBeforeSend(type, payload) {
        if (!payload || !payload.url) return payload;
        try {
          var u = new URL(payload.url, location.href);
          var path = u.hash.indexOf('#/') === 0 ? u.hash.slice(1).split('?')[0] : u.pathname;
          path = path
            .replace(/^\/l\/[^/]+/, '/l/:token')
            .replace(/^\/e\/[^/]+/, '/e/:code')
            .replace(/^\/listes\/[^/]+/, '/listes/:id')
            .replace(/^\/evenements\/[^/]+/, '/evenements/:id');
          payload.url = path;
        } catch (e) {}
        return payload;
      }
    </script>
    <script
      defer
      src="https://cloud.umami.is/script.js"
      data-website-id="a914a95b-e74b-434e-905b-614f507be211"
      data-domains="iwantthis.gift"
      data-before-send="umamiBeforeSend"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- Skimlinks : liens partenaires automatiques pour les magasins sans programme direct -->
    <script type="text/javascript" src="https://s.skimresources.com/js/312275X1800861.skimlinks.js"></script>
  </body>
</html>

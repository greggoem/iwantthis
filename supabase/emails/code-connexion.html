<!-- Supabase > Authentication > Emails > Templates > « Magic link or OTP »
     Objet : Votre code I Want This : {{ .Token }} -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:480px;margin:0 auto;padding:24px;color:#1f2a24">
  <h1 style="font-family:Arial,Helvetica,sans-serif;color:#0f0f10;font-size:22px;letter-spacing:-0.5px;margin:0 0 20px">I Want This</h1>
  <p>Bonjour,</p>
  <p>Voici votre code de connexion :</p>
  <p style="font-size:32px;font-weight:bold;letter-spacing:6px;margin:16px 0;color:#0f0f10">{{ .Token }}</p>
  <p>Recopiez-le sur la page de connexion. Il est valable une heure.</p>
  <p style="margin:24px 0">
    <a href="{{ .SiteURL }}/#/confirm?token_hash={{ .TokenHash }}&type=magiclink"
       style="background:#0f0f10;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:999px;font-weight:bold;display:inline-block">
      Ou se connecter directement
    </a>
  </p>
  <p style="font-size:13px;color:#667069">Vous n'avez rien demandé ? Ignorez ce message : personne ne peut se connecter sans ce code.</p>
</div>
